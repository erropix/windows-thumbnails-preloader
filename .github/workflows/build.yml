name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create (for example, v2.0.0)
        required: true
        type: string
      runtime:
        description: Windows architecture to publish
        required: true
        type: choice
        options:
          - win-x64
          - win-arm64
        default: win-x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained executable
        env:
          RUNTIME: ${{ github.event.inputs.runtime || 'win-x64' }}
        run: >-
          dotnet publish src/ThumbsPreloader/ThumbsPreloader.csproj `
          --configuration Release `
          --runtime $env:RUNTIME `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output publish

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: gh release create "$env:TAG_NAME" publish/ThumbsPreloader.exe --title "$env:TAG_NAME" --generate-notes
